steps:
  - label: "CUDA Test - Julia 1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
    command: |
      julia -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.develop(path=".")
                Pkg.update()
                Pkg.status()

                println("+++ :julia: Running tests")
                Pkg.test("TrixiCUDA")'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  - label: "CUDA Test - latest stable Julia"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    command: |
      julia -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.develop(path=".")
                Pkg.update()
                Pkg.status()

                println("+++ :julia: Running tests")
                Pkg.test("TrixiCUDA")'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  - label: "Documentation - Julia 1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
    command: |
      julia --project -e '
        println("--- :julia: Instantiating project")
        using Pkg
        Pkg.instantiate()
        Pkg.build()
        Pkg.activate("docs")
        Pkg.develop(path=pwd())
        Pkg.instantiate()
        push!(LOAD_PATH, @__DIR__)

        println("+++ :julia: Building documentation")
        include("docs/make.jl")'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip docs\]/
    timeout_in_minutes: 10
