steps:
  - label: "Test TrixiCUDA.jl - Julia {{matrix.julia}}"
    matrix:
      setup:
        julia: ["1.10", "1.11", "1.12", "1.13"]
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
    command: |
      julia --project=. -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.update()
                Pkg.status()

                println("+++ :julia: Running tests")
                Pkg.test()'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  # Branch push builds can lack PR metadata even when the branch has an open PR.
  - label: "Documentation - Julia 1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
    command: |
      julia --project=docs -e '
        println("--- :julia: Instantiating project")
        using Pkg
        Pkg.develop(path=pwd())
        Pkg.instantiate()

        println("+++ :julia: Building documentation")
        include("docs/make.jl")'
    artifact_paths: "docs/build/**/*"
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip docs\]/
    timeout_in_minutes: 15

  # Both revisions run sequentially in this job, on whichever CUDA agent picks it up.
  - label: ":racehorse: GPU RHS benchmarks"
    key: "benchmarks"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
    command: bash .buildkite/benchmark.sh
    agents:
      queue: "cuda"
    concurrency: 1
    concurrency_group: "trixicuda-rhs-benchmarks"
    if: build.message !~ /\[skip benchmarks\]/
    timeout_in_minutes: 60
    soft_fail: true
    artifact_paths:
      - "benchmark/results/*.toml"
      - "benchmark/results/*.md"
      - "benchmark/results/environments/*/Project.toml"
      - "benchmark/results/environments/*/Manifest.toml"
