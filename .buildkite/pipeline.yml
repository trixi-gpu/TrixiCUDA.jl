steps:
  # Collect coverage once, reusing the existing Julia 1.10 GPU test run.
  - label: "Test TrixiCUDA.jl - Julia 1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
      - JuliaCI/julia-coverage#v1:
          dirs: ["src"]
          fail-on-error: false
    env:
      TRIXICUDA_COVERAGE: "true"
    command: &run-tests |
      julia --project=. -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.update()
                Pkg.status()

                println("+++ :julia: Running tests")
                coverage = get(ENV, "TRIXICUDA_COVERAGE", "false") == "true" ? "user" : false
                Pkg.test(; coverage)'
    artifact_paths: "lcov.info"
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  - label: "Test TrixiCUDA.jl - Julia {{matrix.julia}}"
    matrix:
      setup:
        julia: ["1.11", "1.12", "1.13"]
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
    command: *run-tests
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  - label: "Documentation - Julia 1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
    command: |
      julia --project=docs -e '
        println("--- :julia: Instantiating project")
        using Pkg
        Pkg.develop(path=pwd())
        Pkg.instantiate()

        println("+++ :julia: Building documentation")
        include("docs/make.jl")'
    artifact_paths: "docs/build/**/*"
    agents:
      queue: "cuda"
    if: build.pull_request.id != null && build.message !~ /\[skip docs\]/
    timeout_in_minutes: 15
