name: GPU Benchmarks

on:
  # Pushes to main and to branches of open PRs from this repository are benchmarked
  # when the commit title contains "[benchmark mini]" or "[benchmark sweep]". There is
  # no manual trigger.
  # Fork PRs never trigger this workflow, so untrusted code cannot reach the GPU runner.
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare benchmarks
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.select.outputs.head }}
      pr: ${{ steps.select.outputs.pr }}
      base: ${{ steps.select.outputs.base }}
      mini: ${{ steps.select.outputs.mini }}
      sweep: ${{ steps.select.outputs.sweep }}
    steps:
      - name: Select the commit to benchmark
        id: select
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const {full_name: fullName, default_branch: defaultBranch} = context.payload.repository;
            const branch = context.ref.replace('refs/heads/', '');

            let pr;
            if (branch !== defaultBranch) {
              const prs = await github.paginate(github.rest.pulls.list, {
                ...repo,
                state: 'open',
                head: `${repo.owner}:${branch}`,
                per_page: 100
              });
              pr = prs.find(pr => pr.head.repo?.full_name === fullName);
              if (!pr) return;
            }
            if (pr && (pr.state !== 'open' || pr.draft || pr.head.repo?.full_name !== fullName)) return;

            const {data: commit} = await github.rest.repos.getCommit({...repo, ref: context.sha});
            const title = commit.commit.message.split('\n', 1)[0];
            const mini = title.includes('[benchmark mini]'), sweep = title.includes('[benchmark sweep]');
            if (!mini && !sweep) return;
            core.setOutput('mini', mini);
            core.setOutput('sweep', sweep);
            core.setOutput('head', context.sha);
            core.setOutput('pr', pr?.number ?? '');
            core.setOutput('base', pr?.base.ref ?? defaultBranch);

  mini:
    name: Run benchmark mini
    needs: prepare
    if: needs.prepare.outputs.mini == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    concurrency:
      group: gpu-rhs-${{ github.repository }}
      queue: max
    timeout-minutes: 60
    continue-on-error: true
    outputs:
      complete: ${{ steps.benchmark.outcome == 'success' }}
      head: ${{ needs.prepare.outputs.head }}
      pr: ${{ needs.prepare.outputs.pr }}
      base: ${{ needs.prepare.outputs.base }}
    steps:
      - name: Check out the measured commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the mini benchmark
        id: benchmark
        uses: ./.github/actions/gpu-benchmark
        with:
          scope: mini
          head: ${{ needs.prepare.outputs.head }}
          base: ${{ needs.prepare.outputs.base }}

  mini-comment:
    name: Publish mini comment
    needs: mini
    if: needs.mini.outputs.pr != '' && needs.mini.outputs.complete == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the comment publisher
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Publish or update bot comment
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.mini.outputs.pr }}
          HEAD_SHA: ${{ needs.mini.outputs.head }}
          BASE_BRANCH: ${{ needs.mini.outputs.base }}
        with:
          script: |
            await require('./.github/scripts/benchmark-comment.js')({github, context});

  sweep:
    name: Run benchmark sweep
    needs: prepare
    if: needs.prepare.outputs.sweep == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    concurrency:
      group: gpu-rhs-${{ github.repository }}
      queue: max
    # This timeout value depends on the total time for the sweep benchmark.
    timeout-minutes: 300
    continue-on-error: true
    outputs:
      complete: ${{ steps.benchmark.outcome == 'success' }}
      head: ${{ needs.prepare.outputs.head }}
      pr: ${{ needs.prepare.outputs.pr }}
      base: ${{ needs.prepare.outputs.base }}
    steps:
      - name: Check out the measured commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the sweep benchmark
        id: benchmark
        uses: ./.github/actions/gpu-benchmark
        with:
          scope: sweep
          head: ${{ needs.prepare.outputs.head }}
          base: ${{ needs.prepare.outputs.base }}

  sweep-docs:
    name: Build sweep heatmaps
    needs: sweep
    if: needs.sweep.outputs.complete == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      # Build the branch as it is now, so that pushes during the sweep keep their docs.
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Download the sweep results
        uses: actions/download-artifact@v7
        with:
          name: gpu-rhs-sweep-results-${{ needs.sweep.outputs.head }}
          path: sweep-results
      - name: Set up Julia 1.10
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.10"
      - name: Restore Julia cache
        uses: julia-actions/cache@v3
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHMARK_SWEEP_COMPARISON: ${{ github.workspace }}/sweep-results/comparison.json
          BENCHMARK_SWEEP_PR: ${{ needs.sweep.outputs.pr }}
        run: julia --project=docs --color=yes docs/make.jl
