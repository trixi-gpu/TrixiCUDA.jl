name: Documentation

on:
  push:
    branches:
      - main
    tags: "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Deploy Docs
    # Fork PRs keep their build-only documentation check on Buildkite.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Julia 1.10
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Restore Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate docs environment
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build & deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # for Documenter via GitHub Actions
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}  # optional: SSH deploy key
        run: julia --project=docs/ --color=yes docs/make.jl
