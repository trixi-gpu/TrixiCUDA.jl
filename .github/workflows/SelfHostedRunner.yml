name: Self-hosted runner check

on:
  push:
    branches:
      - benchmark-rhs-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 5
    steps:
      - name: Check GPU and Julia
        run: |
          nvidia-smi
          julia --version
