name: Style

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Formatting and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check benchmark comparison driver
        run: python3 benchmark/ci/test_ci.py
      - name: Check benchmark PR reports
        run: node --test .github/scripts/benchmark-comment.test.mjs
      - name: Check spelling
        uses: crate-ci/typos@v1.39.0
        with:
          config: .typos.toml
      - name: Check formatting
        uses: julia-actions/julia-format@v4
        with:
          version: '2.14.0'
