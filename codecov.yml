coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false
  # Allow the initial PR report before main has its first coverage upload.
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: false
